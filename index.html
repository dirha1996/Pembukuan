<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002B33">
<title>Finance HCD</title>
<meta name="description" content="Finance HCD: pencatatan transaksi, anggaran, dan laporan keuangan">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<!--
  FINANCE HCD - satu file (HTML + CSS + JS), tanpa library luar. Data disimpan di localStorage browser.
  PETA FILE (cari kode "[...]" untuk lompat ke bagian):
    CSS : [CSS-1] dasar & cetak | [CSS-2] animasi | [CSS-3] mode gelap | [CSS-4] responsif HP
          [CSS-5] tema | [CSS-6] palet donut & cetak | [CSS-7] menu pengaturan | [CSS-8] tabel laporan | [CSS-9] kartu pilihan laporan
    HTML: [HTML-1] header & menu | [DATA] seed data awal
    JS  : [JS-1] state & helper | [JS-2] Dashboard | [JS-3] Transaksi | [JS-4] Anggaran
          [JS-5] Laporan (a-k) : kontrol, model data (repModel), tampilan PDF (repBody), ekspor Excel (exportXlsx)
          [JS-6] event klik/ubah | [JS-7] animasi & tooltip | [JS-8] mode gelap | [JS-9] pulihkan JSON
          [JS-10] sinkron cloud (Firebase) | [JS-11] menu pengaturan | [JS-12] log aktivitas & status keamanan
  Singkatan state: tab=tab aktif, rt=jenis laporan (d/w/m/y), rf=format laporan (pdf/xlsx),
    S=semua data {tx, cats, bud, year}, TY=['Income','Expenses','Savings'].
-->
<style>
/* ===== [CSS-1] Dasar, komponen, laporan & cetak ===== */
* {
  box-sizing:border-box
}
body {
  margin:0;
  font:13px Arial,sans-serif;
  background:#f3f3f3;
  color:#222
}
header {
  background:#002B33;
  color:#fff;
  padding:10px 16px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  justify-content:space-between
}
header h1 {
  margin:0;
  font-size:18px
}
nav button,
.tb button {
  background:transparent;
  color:#fff;
  border:1px solid #5b8a93;
  padding:6px 12px;
  cursor:pointer;
  border-radius:4px
}
nav button.on {
  background:#fff;
  color:#002B33;
  font-weight:700
}
.tb button {
  font-size:12px
}
main {
  padding:12px 16px;
  max-width:1500px;
  margin:auto
}
.card {
  background:#fff;
  border:1px solid #ddd;
  border-radius:6px;
  padding:10px;
  margin-bottom:12px
}
.kpis {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px;
  margin-bottom:12px
}
.kpi {
  background:#fff;
  border:1px solid #ddd;
  border-radius:6px;
  overflow:hidden
}
.kpi h5 {
  margin:0;
  padding:7px 10px;
  background:#002B33;
  color:#fff;
  font-size:12px
}
.kpi div {
  padding:10px;
  font-size:18px;
  font-weight:700
}
.kpi small {
  display:block;
  font-size:11px;
  font-weight:400;
  color:#666
}
.flt {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center
}
select,
input {
  font:inherit;
  padding:5px;
  border:1px solid #bbb;
  border-radius:4px
}
.grid {
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
  gap:12px
}
@media(max-width:900px) {
  .grid {
    grid-template-columns:1fr
  }
}
h3 {
  margin:0 0 8px;
  background:#002B33;
  color:#fff;
  padding:8px 10px;
  font-size:14px;
  border-radius:4px
}
table {
  border-collapse:collapse;
  width:100%
}
th,
td {
  padding:5px 7px;
  border-bottom:1px solid #eee;
  text-align:left;
  white-space:nowrap
}
th {
  color:#fff;
  font-size:12px
}
.bd th {
  background:inherit
}
.bd td:nth-child(n+2),
.r {
  text-align:right
}
tfoot td {
  font-weight:700;
  background:#f7f7f7
}
.pb {
  width:110px;
  height:10px;
  background:#eee;
  border-radius:5px;
  overflow:hidden
}
.pb i {
  display:block;
  height:100%
}
.dns {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));
  gap:10px
}
.dn {
  display:flex;
  gap:8px;
  align-items:center
}
.dn h4 {
  margin:0 0 4px
}
.dn ul {
  list-style:none;
  margin:0;
  padding:0;
  font-size:12px
}
.dn li i {
  display:inline-block;
  width:9px;
  height:9px;
  margin-right:5px
}
.mut {
  color:#666;
  font-size:12px
}
.frm {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:end;
  margin-top:8px
}
.frm label {
  display:flex;
  flex-direction:column;
  gap:3px;
  font-size:12px
}
.frm .w {
  flex:1;
  min-width:200px
}
button.pri {
  background:#002B33;
  color:#fff;
  border:0;
  padding:7px 14px;
  border-radius:4px;
  cursor:pointer
}
button {
  font:inherit;
  cursor:pointer
}
.chips {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px
}
.chips button {
  border:1px solid #bbb;
  background:#fff;
  border-radius:14px;
  padding:4px 10px
}
.chips button.on {
  background:#002B33;
  color:#fff;
  border-color:#002B33
}
.chips small {
  opacity:.7
}
.chips .z {
  opacity:.4
}
.sum {
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  margin-bottom:12px;
  font-weight:700
}
.sum span {
  background:#fff;
  border:1px solid #ddd;
  border-radius:6px;
  padding:6px 12px
}
#tbl th {
  background:#002B33;
  cursor:pointer;
  position:sticky;
  top:0
}
.Income {
  color:#38761D;
  font-weight:700
}
.Expenses {
  color:#990000;
  font-weight:700
}
.Savings {
  color:#1c4587;
  font-weight:700
}
.mh td {
  background:#d9e8ea;
  font-weight:700
}
.ic {
  border:0;
  background:none;
  font-size:14px
}
.bg input {
  width:105px;
  text-align:right
}
.bg td:nth-child(n+2) {
  text-align:right
}
@page {
  size:A4;
  margin:12mm
}
.rpt h2 {
  margin:0;
  font-size:20px;
  color:#002B33
}
.rpt .sub {
  color:#666;
  margin-bottom:10px
}
.rpt h4 {
  margin:14px 0 6px;
  color:#002B33
}
.tsc {
  border:1px solid #444;
  padding:14px 24px;
  display:flex;
  gap:48px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap
}
.tsc h5 {
  margin:0 0 10px;
  font-size:20px
}
.tsc h5 u {
  color:#990000
}
.lg {
  width:auto;
  flex:1;
  min-width:300px;
  max-width:560px;
  font-size:15px
}
.lg td {
  border:0;
  padding:8px 10px
}
.lg i {
  display:inline-block;
  width:26px;
  height:22px;
  vertical-align:middle;
  margin-right:10px;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
}
.lg tfoot td {
  border-top:1px dotted #333;
  background:#fff;
  font-weight:700
}
.sg {
  background:#002B33;
  color:#fff;
  text-align:center;
  padding:9px;
  font-size:18px;
  font-weight:700;
  margin:12px 0;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
}
.sig {
  display:flex;
  gap:60px;
  margin-top:40px
}
.sig div {
  flex:1;
  border-top:1px solid #333;
  padding-top:4px;
  text-align:center
}
@media print {
  header,
  .tb,
  .flt,
  .frm,
  details,
  .ic {
    display:none!important
  }
  body {
    background:#fff
  }
  main {
    padding:0
  }
  .card {
    border:0;
    padding:0
  }
  th,
  .mh td {
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact
  }
  tr {
    break-inside:avoid
  }
  .kpi {
    break-inside:avoid
  }
  .kpi h5 {
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact
  }
}

/* ===== [CSS-2] Interaktif & animasi halus ===== */
html {
  scroll-behavior:smooth
}
header {
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px rgba(0,0,0,.18)
}
nav button,
.tb button {
  transition:background .2s,color .2s,transform .15s,box-shadow .2s
}
nav button:hover,
.tb button:hover {
  background:rgba(255,255,255,.16)
}
nav button.on:hover {
  background:#fff
}
button:active {
  transform:scale(.96)
}
button.pri {
  transition:background .2s,transform .15s,box-shadow .2s
}
button.pri:hover {
  background:#0b4651;
  box-shadow:0 3px 8px rgba(0,43,51,.3)
}
.chips button {
  transition:all .2s
}
.chips button:hover {
  border-color:#002B33;
  transform:translateY(-1px)
}
.ic {
  transition:transform .15s,opacity .15s;
  opacity:.5
}
tr:hover .ic {
  opacity:1
}
.ic:hover {
  transform:scale(1.3)
}
select,
input {
  transition:border-color .2s,box-shadow .2s
}
select:focus,
input:focus {
  outline:none;
  border-color:#002B33;
  box-shadow:0 0 0 3px rgba(0,43,51,.15)
}
.kpi,
.dn {
  transition:transform .25s,box-shadow .25s
}
.kpi:hover {
  transform:translateY(-3px);
  box-shadow:0 6px 16px rgba(0,0,0,.12)
}
tbody tr {
  transition:background .15s
}
tbody tr:hover td {
  background:#eef6f7
}
.mh:hover td {
  background:#d9e8ea
}
#tbl th {
  transition:background .15s
}
#tbl th:hover {
  background:#0b4651
}
@keyframes rise {
  from {
    opacity:0;
    transform:translateY(14px)
  }
}
#app.enter>* {
  animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards
}
#app.enter>*:nth-child(2) {
  animation-delay:.05s
}
#app.enter>*:nth-child(3) {
  animation-delay:.1s
}
#app.enter>*:nth-child(4) {
  animation-delay:.15s
}
#app.enter>*:nth-child(5) {
  animation-delay:.2s
}
#app.enter>*:nth-child(n+6) {
  animation-delay:.25s
}
@keyframes grow {
  from {
    transform:scaleX(0)
  }
}
.pb i {
  transform-origin:left;
  animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards
}
@keyframes barup {
  from {
    transform:scaleY(0)
  }
}
svg rect {
  transform-box:fill-box;
  transform-origin:bottom;
  animation:barup .7s cubic-bezier(.2,.8,.2,1) backwards;
  transition:opacity .2s,filter .2s
}
svg rect:hover {
  filter:brightness(1.2)
}
svg rect[opacity]:hover {
  opacity:1
}
svg rect[data-mo] {
  cursor:pointer
}
@keyframes dn {
  from {
    opacity:0;
    stroke-width:0
  }
}
.dn svg circle,
.tsc svg circle {
  animation:dn .8s ease backwards;
  transition:opacity .2s,filter .2s
}
.dn svg circle:nth-of-type(2),
.tsc svg circle:nth-of-type(2) {
  animation-delay:.08s
}
.dn svg circle:nth-of-type(3),
.tsc svg circle:nth-of-type(3) {
  animation-delay:.16s
}
.dn svg circle:nth-of-type(4),
.tsc svg circle:nth-of-type(4) {
  animation-delay:.24s
}
.dn svg circle:nth-of-type(n+5),
.tsc svg circle:nth-of-type(n+5) {
  animation-delay:.32s
}
.dn svg:hover circle,
.tsc svg:hover circle {
  opacity:.5
}
.dn svg circle:hover,
.tsc svg circle:hover {
  opacity:1;
  filter:brightness(1.1)
}
@keyframes rowin {
  from {
    opacity:.2
  }
}
#tbl tbody tr {
  animation:rowin .2s ease backwards
}
@keyframes flash {
  from {
    background:#ffe27a
  }
}
.flash td {
  animation:flash 1.8s ease
}
.out td {
  opacity:0;
  transition:opacity .25s
}
.out {
  background:#fdeaea
}
#ts {
  position:fixed;
  bottom:16px;
  left:50%;
  transform:translate(-50%,24px);
  opacity:0;
  pointer-events:none;
  background:#002B33;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  z-index:60;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  transition:opacity .3s,transform .3s cubic-bezier(.2,.8,.2,1)
}
#ts.show {
  opacity:1;
  transform:translate(-50%,0);
  pointer-events:auto
}
#ts button {
  margin-left:8px;
  padding:4px 10px;
  border:1px solid #5b8a93;
  background:transparent;
  color:#fff;
  border-radius:4px
}
#tip {
  position:fixed;
  left:0;
  top:0;
  pointer-events:none;
  opacity:0;
  background:#002B33;
  color:#fff;
  font-size:12px;
  padding:6px 10px;
  border-radius:6px;
  z-index:70;
  max-width:260px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
  transition:opacity .15s
}
#tip.show {
  opacity:1
}
.bg input:focus {
  background:#fffbe6
}
@media (prefers-reduced-motion:reduce) {
  * {
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important
  }
}
@media print {
  * {
    animation:none!important;
    transition:none!important
  }
  #tip,
  #ts {
    display:none!important
  }
  header {
    position:static
  }
}

/* ===== [CSS-3] Transisi mode gelap ===== */
.tt,
.tt * {
  transition:background-color .35s,color .35s,border-color .35s,fill .35s,stroke .35s!important
}
#dm {
  min-width:92px
}

/* ===== [CSS-4] Responsif (desktop, tablet, HP) ===== */
html {
  -webkit-text-size-adjust:100%
}
main {
  min-width:0
}
.msort {
  display:none
}
/* header tabel transaksi tidak "floating" menimpa baris */
#tbl {
  padding-top:0
}
#tbl table {
  border-collapse:separate;
  border-spacing:0
}
#tbl th {
  z-index:2
}
@media(hover:none) {
  .kpi:hover,
  .dn:hover {
    transform:none;
    box-shadow:none
  }
  .chips button:hover {
    transform:none
  }
}
@media screen and (max-width:900px) {
  .grid {
    grid-template-columns:minmax(0,1fr)
  }
  .grid>.card {
    min-width:0
  }
  .bg td:first-child,
  .bg th:first-child {
    position:sticky;
    left:0;
    z-index:1
  }
  .bg td:first-child {
    background:#fff
  }
  .bg tfoot td:first-child {
    background:#f7f7f7
  }
  html.dark .bg td:first-child {
    background:#1a2326
  }
  html.dark .bg tfoot td:first-child {
    background:#202b2e
  }
}
@media screen and (max-width:700px) {
  body {
    font-size:14px;
    padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))
  }
  main {
    padding:8px
  }
  .card {
    padding:8px
  }
  /* header: judul + toolbar geser, menu utama jadi tab bawah */
  header {
    position:static;
    padding:8px 10px;
    gap:6px;
    box-shadow:none
  }
  header h1 {
    font-size:17px
  }
  .tb {
    display:flex;
    gap:6px;
    overflow-x:auto;
    width:100%;
    padding-bottom:2px;
    -webkit-overflow-scrolling:touch
  }
  .tb button {
    flex:none;
    white-space:nowrap;
    padding:8px 12px
  }
  nav {
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:30;
    display:flex;
    background:#002B33;
    border-top:1px solid #1f4a53;
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-shadow:0 -2px 10px rgba(0,0,0,.2)
  }
  html.dark nav {
    background:#001a1f
  }
  nav button {
    flex:1;
    border:0;
    border-radius:0;
    padding:11px 2px;
    font-size:11.5px;
    line-height:1.2;
    min-height:48px
  }
  nav button.on {
    background:#fff;
    color:#002B33
  }
  #ts {
    bottom:calc(76px + env(safe-area-inset-bottom,0px));
    max-width:92vw
  }
  /* sentuhan lebih nyaman, hindari zoom otomatis iOS */
  select,
  input {
    font-size:16px;
    min-height:40px
  }
  input[type=checkbox] {
    min-height:0;
    width:18px;
    height:18px
  }
  button {
    min-height:40px
  }
  .chips button {
    padding:6px 12px;
    min-height:34px
  }
  summary {
    padding:6px 0
  }
  /* kartu ringkasan */
  .kpis {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px
  }
  .kpis .kpi:last-child:nth-child(odd) {
    grid-column:1/-1
  }
  .kpi div {
    font-size:15px;
    padding:8px;
    overflow-wrap:anywhere
  }
  .kpi h5 {
    font-size:11px;
    padding:6px 8px
  }
  /* filter & form */
  .flt {
    gap:8px
  }
  .flt>select {
    flex:1 1 120px;
    min-width:0
  }
  .flt>input[type=text],
  .flt>input:not([type]),
  #q_q {
    flex:1 1 100%
  }
  .flt>select.msort {
    display:block
  }
  .flt label {
    display:flex;
    align-items:center;
    gap:6px
  }
  .frm label {
    flex:1 1 calc(50% - 10px);
    min-width:130px
  }
  .frm label.w {
    flex:1 1 100%
  }
  .frm input,
  .frm select {
    width:100%
  }
  .frm>div {
    flex:1 1 100%;
    display:flex;
    flex-wrap:wrap;
    gap:8px
  }
  .frm>div button {
    flex:1 1 auto
  }
  .sum {
    gap:8px;
    font-size:13px
  }
  .sum span {
    flex:1 1 auto;
    padding:6px 10px
  }
  /* dashboard */
  .grid .bd th:nth-child(5),
  .grid .bd td:nth-child(5) {
    display:none
  }
  .dn {
    flex-wrap:wrap;
    justify-content:center
  }
  #app svg[width="100%"] {
    min-width:720px
  }
  .chs {
    overflow-x:auto
  }
  .chs svg {
    display:block
  }
  .rpt table:not(.lg) {
    display:block;
    overflow-x:auto;
    max-width:100%
  }
  .card>table td {
    white-space:normal
  }
  .card>table td:first-child,
  .card>table td.r {
    white-space:nowrap
  }
  .grid .bd {
    font-size:12.5px
  }
  .grid .bd th,
  .grid .bd td {
    padding:5px 5px
  }
  .bg input {
    min-height:34px;
    padding:3px 5px
  }
  /* laporan */
  .tsc {
    padding:12px;
    gap:16px
  }
  .tsc svg {
    max-width:100%;
    height:auto
  }
  .lg {
    min-width:0;
    width:100%;
    font-size:13px
  }
  .lg td {
    padding:6px 4px
  }
  .rpt h2 {
    font-size:17px
  }
  /* tabel transaksi menjadi kartu */
  #tbl.card {
    background:none;
    border:0;
    padding:0;
    max-height:none!important;
    overflow:visible!important
  }
  #tbl table,
  #tbl tbody {
    display:block;
    width:100%;
    overflow:visible
  }
  #tbl thead {
    display:none
  }
  #tbl tr {
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    column-gap:10px;
    row-gap:3px;
    padding:10px 12px;
    margin-bottom:8px;
    border:1px solid rgba(128,128,128,.3);
    border-radius:8px;
    background:rgba(128,128,128,.07)
  }
  html #tbl td {
    display:block;
    border:0;
    padding:0;
    white-space:normal;
    text-align:left;
    min-width:0;
    overflow-wrap:anywhere
  }
  #tbl td:nth-child(2) {
    grid-column:1;
    grid-row:1;
    font-size:12px;
    opacity:.75
  }
  #tbl td:nth-child(3) {
    grid-column:2;
    grid-row:1;
    text-align:right;
    font-size:12px
  }
  #tbl td:nth-child(4) {
    grid-column:1;
    grid-row:2;
    font-weight:600
  }
  #tbl td:nth-child(6) {
    grid-column:2;
    grid-row:2;
    text-align:right;
    font-weight:700;
    font-size:15px
  }
  #tbl td:nth-child(5) {
    grid-column:1/-1;
    grid-row:3
  }
  #tbl td:nth-child(7) {
    grid-column:1;
    grid-row:4;
    font-size:12px;
    opacity:.7;
    text-align:left
  }
  #tbl td:nth-child(7)::before {

    opacity:.7;
    text-align:right
  }

  }

  }
  #tbl td[colspan] {
    grid-column:1/-1;
    grid-row:auto;
    opacity:1;
    font-size:inherit
  }
  #tbl td[colspan]::before {

  }
  #tbl tr.mh {

  }
  #tbl tbody tr:not(.mh):hover td {
    background:transparent
  }

/* ===== [CSS-7] Menu pengaturan (gear) & kontrol laporan yang halus ===== */
@media screen {
  .tb {
    position:relative
  }
  #gb {
    display:flex;
    align-items:center;
    gap:8px
  }
  #gb .gl {
    flex:1;
    text-align:left
  }
  #gb .gi {
    display:inline-block;
    transition:transform .5s cubic-bezier(.2,.8,.2,1)
  }
  #gb .chev {
    display:inline-block;
    transition:transform .35s cubic-bezier(.2,.8,.2,1);
    opacity:.6
  }
  #gb[aria-expanded=true] .gi {
    transform:rotate(180deg)
  }
  #gb[aria-expanded=true] .chev {
    transform:rotate(180deg)
  }
  #gb[aria-expanded=true] {
    background:var(--soft)
  }
  /* panel: tinggi dianimasikan lewat grid-template-rows 0fr -> 1fr */
  .tbm {
    display:grid;
    grid-template-rows:0fr;
    opacity:0;
    transform:translateY(6px);
    transition:grid-template-rows .38s cubic-bezier(.2,.8,.2,1),opacity .28s ease,transform .38s cubic-bezier(.2,.8,.2,1)
  }
  .tbm.open {
    grid-template-rows:1fr;
    opacity:1;
    transform:none
  }
  .tbi {
    min-height:0;
    overflow:hidden;
    visibility:hidden;
    transition:visibility 0s .38s
  }
  .tbm.open .tbi {
    visibility:visible;
    transition-delay:0s
  }
  .tbp {
    display:flex;
    flex-direction:column;
    gap:6px
  }
  .tbp button {
    width:100%
  }
  .tbp button {
    opacity:0;
    transform:translateY(8px);
    transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1),background .2s
  }
  .tbm.open .tbp button {
    opacity:1;
    transform:none
  }
  .tbm.open .tbp button {
    transition-delay:calc(var(--i,0) * .03s)
  }
}
@media screen and (min-width:901px) {
  .tb {
    flex-direction:column-reverse
  }
  /* panel muncul di atas tombol gear */
}

function catRenameDo(t, i, old, n) {

        if (x.t == t && x.c == old) {

const CRC_TABLE = (() => {

/* Satu sheet: rows = [{s, c:[sel...]}]; s: 'h' = header, 'b' = tebal, '' = biasa */
function sheetXml(rows, widths) {
  const style = (s, v) => s == 'h' ? 2 : s == 'b' ? (typeof v == 'number' ? 4 : 1) : (typeof v == 'number' ? 3 : 0);
  const cell = (v, s, r, c) => {
    const ref = String.fromCharCode(65 + c) + (r + 1), st = style(s, v);
    if (v === '' || v == null) return s ? `<c r="${ref}" s="${st}"/>` : '';
    return typeof v == 'number'
      ? `<c r="${ref}" s="${st}"><v>${v}</v></c>`
      : `<c r="${ref}" s="${st}" t="inlineStr"><is><t xml:space="preserve">${esc(v)}</t></is></c>`;
  };
  const data = rows.map((row, r) => `<row r="${r + 1}">${row.c.map((v, c) => cell(v, row.s, r, c)).join('')}</row>`).join('');
  const cols = widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>${cols}</cols><sheetData>${data}</sheetData></worksheet>`;
}

const typing = () => {
    const a = document.activeElement;
    return !!a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && !!a.closest('#app');
};
function sIcon() {
    const b = $('#sy');
    if (!b)
        return;
    const T = new Date(lastOk).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    b.dataset.st = !sbase() ? 'off' : st;
    b.querySelector('.ml').textContent = !sbase() ? 'Atur sinkron cloud' : st == 'ok' ? 'Tersinkron ' + T : st == 'sync' ? 'Menyinkronkan…' : 'Gagal sinkron · coba lagi';
}
async function put() {
    if (!S._u) {
        S._u = Date.now();
        save(true);
    }
    const body = JSON.stringify({ u: S._u, data: JSON.stringify(S) });
    const r = await fetch(U('/current'), { method: 'PUT', body });
    if (!r.ok)
        throw new Error('HTTP ' + r.status);
    dirty = 0;
    try {
        await fetch(U('/history/' + new Date().toLocaleDateString('sv-SE')), { method: 'PUT', body });
    }
    catch (e) {
    }
}
function push() {
    if (!sbase())
        return;
    dirty = 1;
    clearTimeout(pushT);
    pushT = setTimeout(async () => {
        if (busy) {
            push();
            return;
        }
        busy = 1;
        st = 'sync';
        sIcon();
        try {
            await put();
            st = 'ok';
            lastOk = Date.now();
        }
        catch (e) {
            st = 'err';
        }
        busy = 0;
        sIcon();
    }, 1200);
}
async function pull() {
    if (!sbase() || busy || document.hidden)
        return;
    busy = 1;
    st = 'sync';
    sIcon();
    try {
        const r = await fetch(U('/current'), { cache: 'no-store' });
        if (!r.ok)
            throw new Error('HTTP ' + r.status);
        const R = await r.json();
        if (R && typeof R.data == 'string') {
            const ru = +R.u || 0;
            const lu = +S._u || 0;
            if (ru > lu) {
                if (!typing()) {
                    const o = JSON.parse(R.data);
                    if (Array.isArray(o.tx) && o.cats) {
                        S = o;
                        S._u = ru;
                        save(true);
                        render();
                        toast('Data terbaru dari perangkat lain dimuat ✓');
                    }
                }
            }
            else if (lu > ru)
                await put();
        }
        else
            await put();
        st = 'ok';
        lastOk = Date.now();
    }
    catch (e) {
        st = 'err';
    }
    busy = 0;
    sIcon();
}
function dlg(h) {
    let d = $('#dg');
    if (!d) {
        d = document.createElement('dialog');
        d.id = 'dg';
        document.body.appendChild(d);
        d.addEventListener('click', e => {
            if (e.target === d)
                d.close();
        });
    }
    d.innerHTML = h;
    if (!d.open)
        d.showModal();
    return d;
}
function openSync() {
    const d = dlg(`<h3>☁ Sinkronisasi antar perangkat</h3><p class=mut>Semua perangkat dengan alamat yang sama selalu memakai data <b>terbaru</b>. Setiap perubahan dikirim otomatis; perangkat lain memuatnya dalam ≤30 detik atau saat aplikasi dibuka.</p>
 <div class=frm><label>URL Firebase Realtime Database (disarankan dengan path rahasia)<input id=sy_u placeholder="https://nama-proyek-default-rtdb.firebaseio.com/hcd-abc123xyz" value="${esc(SYN.url)}"></label><label>Kunci akses / secret (opsional)<input id=sy_k type=password value="${esc(SYN.key || '')}"></label></div>
 <div class=frm><button class=pri id=sy_s>Simpan &amp; sinkronkan</button><button id=sy_l>Salin tautan setup</button><button id=sy_d>Putuskan</button><button id=sy_c>Tutup</button></div>
 <p class=mut id=sy_m>Jika data di perangkat ini lebih baru dari cloud, cloud akan diperbarui; jika sebaliknya, perangkat ini memuat data cloud.</p>`);
    const m = t => $('#sy_m').textContent = t;
    $('#sy_c').onclick = () => d.close();
    $('#sy_s').onclick = async () => {
        SYN = { url: $('#sy_u').value.trim(), key: $('#sy_k').value.trim() };
        try {
            localStorage.setItem(SKEY, JSON.stringify(SYN));
        }
        catch (e) {
        }
        if (!sbase()) {
            sIcon();
            m('Alamat kosong.');
            return;
        }
        m('Menghubungi cloud…');
        await pull();
        if (st == 'ok') {
            m('Tersambung ✓');
            setTimeout(() => d.close(), 700);
        }
        else
            m('Gagal terhubung. Periksa URL, kunci, dan aturan (rules) database.');
    };
    $('#sy_d').onclick = () => {
        SYN = { url: '', key: '' };
        try {
            localStorage.setItem(SKEY, JSON.stringify(SYN));
        }
        catch (e) {
        }
        st = 'off';
        sIcon();
        m('Sinkronisasi diputus. Data tetap ada di perangkat ini.');
    };
    $('#sy_l').onclick = async () => {
        const u = $('#sy_u').value.trim();
        if (!u) {
            m('Isi URL dulu.');
            return;
        }
        const l = location.href.split('#')[0] + '#sync=' + encodeURIComponent(btoa(JSON.stringify({ url: u, key: $('#sy_k').value.trim() })));
        try {
            await navigator.clipboard.writeText(l);
            m('Tautan disalin. Buka di perangkat lain agar langsung tersambung.');
        }
        catch (e) {
            prompt('Salin tautan ini:', l);
        }
    };
}
async function openHist() {
    if (!sbase()) {
        openSync();
        return;
    }
    const d = dlg('<h3>Riwayat cadangan otomatis</h3><p class=mut>Memuat…</p>');
    try {
        const r = await fetch(U('/history', ['shallow=true']), { cache: 'no-store' });
        if (!r.ok)
            throw 0;
        const o = await r.json();
        const ds = Object.keys(o || {}).sort().reverse();
        d.innerHTML = `<h3>Riwayat cadangan otomatis</h3><p class=mut>Satu salinan per hari (kondisi terakhir pada hari itu). Memulihkan menjadikannya data terbaru di semua perangkat.</p><div style="max-height:50vh;overflow:auto">${ds.map(x => `<div class=hr><span>${fd(x)}</span><button data-h="${x}">Pulihkan</button></div>`).join('') || '<span class=mut>Belum ada riwayat.</span>'}</div><div class=frm><button id=hs_c>Tutup</button></div>`;
        $('#hs_c').onclick = () => d.close();
        d.querySelectorAll('[data-h]').forEach(b => b.onclick = async () => {
            b.textContent = '…';
            try {
                const rr = await fetch(U('/history/' + b.dataset.h), { cache: 'no-store' });
                const R = await rr.json();
                if (applyRestore(JSON.parse(R.data), 'riwayat ' + fd(b.dataset.h)))
                    d.close();
                else
                    b.textContent = 'Pulihkan';
            }
            catch (e) {
                b.textContent = 'Gagal';
            }
        });
    }
    catch (e) {
        d.innerHTML = '<h3>Riwayat cadangan otomatis</h3><p class=mut>Gagal memuat riwayat.</p><div class=frm><button id=hs_c>Tutup</button></div>';
        $('#hs_c').onclick = () => d.close();
    }
}
$('#sy').onclick = openSync;
$('#hs').onclick = openHist;
$('#lg').onclick = openLog;
setInterval(pull, 30000);
addEventListener('online', pull);
addEventListener('focus', pull);
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (dirty && sbase() && !busy) {
            clearTimeout(pushT);
            put().catch(() => {
            });
        }
    }
    else
        pull();
});
sIcon();
pull();

</script></body></html>
